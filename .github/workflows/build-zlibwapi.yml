name: Build zlibwapi.dll

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Pobierz źródła zlib 1.4
        uses: actions/checkout@v7
        with:
          repository: madler/zlib
          ref: v1.4

      - name: Skonfiguruj kompilację x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DZLIB_BUILD_ZLIB1_DLL=ON

      - name: Skompiluj DLL
        run: cmake --build build --config Release

      - name: Przygotuj plik DLL do pobrania
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Filter zlibwapi.dll -Recurse |
            Select-Object -First 1

          if (-not $dll) {
            throw "Nie znaleziono zlibwapi.dll w katalogu build."
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $dll.FullName dist/

      - name: Udostępnij DLL jako artefakt
        uses: actions/upload-artifact@v7
        with:
          name: zlibwapi-v1.4-win-x64
          path: dist/zlibwapi.dll
